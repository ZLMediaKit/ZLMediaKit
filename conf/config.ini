; Guardiã Premier production defaults. Secrets stay in Easypanel/Swarm.

[api]
apiDebug=0
secret=__ZLM_API_SECRET__

[general]
mediaServerId=guardia_zlm
enableVhost=0
listen_ip=::

[protocol]
enable_hls=1
enable_fmp4=1
enable_mp4=1
hls_save_path=/app/storage/recordings/hls
mp4_save_path=/app/storage/recordings
hls_demand=0
fmp4_demand=0

[hook]
; Deliberately disabled per the approved deployment contract.
enable=0

[http]
charSet=utf-8
keepAliveSecond=30
port=18080
rootPath=./www
sslport=18082
dirMenu=0

[rtmp]
port=19350
sslport=0

[rtp_proxy]
; Debug/RTP proxy dumps are persisted under the shared recordings bind mount.
dumpDir=/app/storage/recordings
port=10000
port_range=10000-10100
timeoutSec=15

[rtc]
port=10055
tcpPort=0
; Replaced from ZLM_PUBLIC_IP by the container entrypoint.
externIP=179.189.117.2
enableTurn=0

[record]
appName=record
enableFmp4=1
fastStart=0
